<style>
:root{--bg:#F4F5F9;--surface:#FFFFFF;--ink:#12131A;--muted:#5E6270;--line:#DADCE3;--accent:#B37A10;--chip:#ECEDF2;color-scheme:light}
@media (prefers-color-scheme: dark){:root{--bg:#0E0F14;--surface:#1A1C24;--ink:#F1F2F5;--muted:#A3A7B4;--line:#2E313C;--accent:#E0AA47;--chip:#262934;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:28px 20px 64px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.wordmark{font-weight:800;font-size:20px;letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.wordmark span{color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav a{font-size:14px;font-weight:700;color:var(--ink);text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--chip)}
.nav a[aria-current]{background:var(--ink);color:var(--bg)}
h1{font-size:34px;line-height:1.1;letter-spacing:-.03em;margin:0 0 8px;font-weight:800}
.lead{color:var(--muted);margin:0 0 28px;font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px 22px 8px;margin:0 0 16px}
h2{font-size:19px;letter-spacing:-.01em;margin:0 0 10px;font-weight:800}
h3{font-size:16px;margin:18px 0 6px;font-weight:800}
p,li{font-size:15.5px}
p{margin:0 0 14px}
ul{margin:0 0 14px;padding-left:20px}
li{margin:0 0 6px}
a{color:var(--accent);font-weight:700}
.mail{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);text-decoration:none;padding:12px 18px;border-radius:999px;font-weight:800;margin:4px 0 16px}
.muted{color:var(--muted)}
.foot{margin-top:28px;font-size:13.5px;color:var(--muted);text-align:center}
.foot a{color:var(--muted)}

.list-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.owner{font-size:14px;font-weight:700;color:var(--muted)}
.owner b{color:var(--accent)}
.cat-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--t1);color:var(--deep);font-size:13px;font-weight:800}
.cat-pill svg{width:16px;height:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 20px;border-radius:999px;font-size:15px;font-weight:800;text-decoration:none;border:none}
.btn-primary{background:var(--ink);color:var(--bg)}
.btn-ghost{background:var(--chip);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 12px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.cover{position:relative;aspect-ratio:2/3;border-radius:16px;overflow:hidden;background:var(--t2);color:var(--deep);display:flex;align-items:center;justify-content:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover > svg{width:36%;max-width:44px}
.pill{position:absolute;left:6px;bottom:6px;display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:800;background:var(--surface);color:var(--ink)}
.pill.completed{background:var(--t1);color:var(--deep)}
.pill.dropped{background:#FBE3E1;color:#A3322B}
.score{position:absolute;right:6px;top:6px;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:800;background:rgba(18,19,26,.78);color:#fff}
.t-title{font-size:14px;font-weight:800;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.t-sub{font-size:12.5px;color:var(--muted);font-weight:600}
.t-note{margin-top:2px;font-size:13px;line-height:1.45;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.t-note::before{content:var(--note-label,"Note");display:block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.state{padding:40px 0;text-align:center;color:var(--muted)}
.report{display:block;margin-top:26px;text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.site-foot{margin-top:26px;padding-top:16px;border-top:1px solid var(--line);text-align:center}
.site-foot .links{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:13px;font-weight:700}
.site-foot .links a{color:var(--muted);text-decoration:none}
.site-foot .links a:hover{text-decoration:underline}
.site-foot .fine{margin:8px 0 0;font-size:11px;line-height:1.5;color:var(--muted);opacity:.75}
.site-foot .fine a{color:inherit}
.top{flex-wrap:wrap}
.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lang-pick{position:relative;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px 0 10px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:700;color:var(--ink)}
.lang-pick svg{width:16px;height:16px}
.lang-pick select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font:inherit}
.lang-pick:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.wm-mark{display:inline-block;width:1.3em;height:1.3em;vertical-align:-0.3em;margin-right:.36em;border-radius:22%}
